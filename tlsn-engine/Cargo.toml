[package]
name = "kucoin-tlsn"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tlsn_insecure)'] }

[dependencies]
tlsn = { path = "../vendor/tlsn/crates/tlsn", features = ["mozilla-certs"] }
tlsn-formats = { path = "../vendor/tlsn/crates/formats" }
spansy = { git = "https://github.com/tlsnotary/tlsn-utils", rev = "6f1a934" }
anyhow = "1"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = "0.3"
